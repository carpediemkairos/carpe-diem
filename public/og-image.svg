<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050a"/>
      <stop offset="50%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7000ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f2fe"/>
      <stop offset="60%" stop-color="#b389ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8de"/>
      <stop offset="20%" stop-color="#fae5a0"/>
      <stop offset="55%" stop-color="#5c3f12"/>
      <stop offset="84%" stop-color="#ecc269"/>
      <stop offset="100%" stop-color="#fff0bf"/>
    </linearGradient>
    <filter id="carve" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/>
      <feOffset in="b" dx="0" dy="4" result="o"/>
      <feFlood flood-color="#000" flood-opacity="0.7"/>
      <feComposite in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Subtle grid -->
  <g stroke="#00f2fe" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- CD monogram badge (top-left) — exact profile.svg shape, group-translated to center -->
  <g transform="translate(90, 90)">
    <circle cx="80" cy="80" r="80" fill="#0a0a0e" stroke="url(#mark)" stroke-width="3"/>
    <g filter="url(#carve)" transform="translate(0, 15)" fill="url(#gold)" font-family="'Cormorant Garamond','Playfair Display',serif" font-weight="400">
      <text x="69" y="94" text-anchor="middle" font-size="86">C</text>
      <text x="94" y="92" text-anchor="middle" font-size="61">D</text>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="90" y="360" font-family="'Orbitron','Helvetica Neue',Arial,sans-serif"
        font-weight="900" font-size="120" letter-spacing="-2" fill="url(#mark)">CARPE / DIEM</text>

  <!-- Tagline -->
  <text x="90" y="430" font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="500" font-size="34" fill="#c0c0c0" letter-spacing="0.5">
    Cinematic DaVinci Resolve Editing
  </text>

  <!-- Sub-tagline -->
  <text x="90" y="475" font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="400" font-size="24" fill="#888" letter-spacing="2">
    NARRATIVE  ·  COMMERCIAL  ·  RETENTION  ·  EXPLAINER
  </text>

  <!-- Open for booking pill (bottom-right) -->
  <g transform="translate(870, 520)">
    <rect width="240" height="56" rx="28" fill="rgba(74,222,128,0.12)"
          stroke="#4ade80" stroke-width="1.5"/>
    <circle cx="32" cy="28" r="6" fill="#4ade80"/>
    <text x="55" y="36" font-family="'Inter','Helvetica Neue',Arial,sans-serif"
          font-weight="600" font-size="18" fill="#4ade80" letter-spacing="2">OPEN FOR BOOKING</text>
  </g>
</svg>
